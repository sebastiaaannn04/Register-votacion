<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de participantes</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#667085;--pri:#3b5bdb;--pri2:#2f49b5;--ok:#2b9348;--err:#d00000;--bd:#e3e7f0;--bar:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1424;--card:#1a2138;--tx:#eef1fb;--mut:#9aa4c0;--pri:#6f8cff;--pri2:#8fa5ff;--bd:#2b3453;--bar:#6f8cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1424;--card:#1a2138;--tx:#eef1fb;--mut:#9aa4c0;--pri:#6f8cff;--pri2:#8fa5ff;--bd:#2b3453;--bar:#6f8cff;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:.2em 0}h2{margin:.2em 0 .6em}
.center{text-align:center;min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.sub{color:var(--mut)}
.btn{border:0;border-radius:14px;padding:16px 26px;font-size:1.1rem;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;transition:.15s}
.btn:hover{background:var(--pri2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}.btn.red{background:var(--err)}.btn.sm{padding:9px 14px;font-size:.9rem;border-radius:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.row.l{justify-content:flex-start;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 2px 10px #0000000d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.cand{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.ph{width:120px;height:120px;border-radius:50%;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;color:var(--mut)}
.ph.s{width:48px;height:48px;font-size:1.1rem;flex:none}
input[type=text],input[type=file],input[type=email],input[type=password],select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem;margin:6px 0 14px}
label{font-weight:600;font-size:.95rem}
.msg{padding:12px 14px;border-radius:12px;margin:10px 0;font-weight:500}.msg.err{background:#d0000018;color:var(--err)}.msg.ok{background:#2b934818;color:var(--ok)}.msg.in{background:#3b5bdb18;color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi b{display:block;font-size:2rem}.kpi span{color:var(--mut);font-size:.9rem}
.bar{display:flex;align-items:center;gap:12px;margin:14px 0}.bar .info{flex:1;min-width:0}
.track{height:26px;background:var(--bd);border-radius:13px;overflow:hidden;margin-top:6px}.fill{height:100%;background:var(--bar);border-radius:13px;transition:width .6s}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs .btn{padding:10px 18px;font-size:1rem}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd)}.sc{overflow-x:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;margin-bottom:16px}.topbar b{font-size:1.15rem}
.btn.ok{background:var(--ok)}.btn.ok:hover{background:#237a3b}
.prog{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri);border-radius:6px;transition:width .3s}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:8px 0 14px}.chk input{width:auto;margin-top:4px}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;padding:16px;z-index:20}#modal.on{display:flex}
#modal .card{max-width:440px;width:100%}
</style>
</head>
<body>
<main><div id="app"></div></main>
<div id="modal"><div class="card" id="mbox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL='https://fgmikvjivqddnyahqepc.supabase.co';
var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbWlrdmppdnFkZG55YWhxZXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMjg4NTksImV4cCI6MjExMDYwNDg1OX0.H5KiSek5CY7hfELt__3b8OMzAxVOSuIjIS85myaYZms';

var sb=null,S={rs:1,rd:{},done:false,welcome:true};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var STEPS=[
 {t:'¿Cómo te llamas?',f:[['nombres','Nombres'],['apellidos','Apellidos']]},
 {t:'Documento de identidad',f:[['documento','Número de documento','numeric']]},
 {t:'Fuerza',sel:1},
 {t:'Grado',f:[['grado','Grado']]},
 {t:'Número de celular',f:[['celular','Celular','numeric']]},
 {t:'Correo electrónico',f:[['correo','Correo electrónico','email']]},
 {t:'Crea tu contraseña',f:[['clave','Contraseña (4 dígitos)','pin'],['clave2','Confirma tu contraseña','pin']],note:'🔑 Anota y recuerda tu contraseña: la necesitarás más adelante para la votación.'}];
var FUERZAS=['Policía Nacional','Ejército Nacional','Armada Nacional','Fuerza Aérea'];
function start(){S.welcome=false;render();window.scrollTo(0,0)}
function render(){
 if(S.welcome){$('app').innerHTML='<div class="center"><div style="font-size:3.5rem">🗳️</div><h1>Bienvenido</h1><h2 class="sub" style="font-weight:500;margin:0">Registro de participantes a la votación</h2><p class="sub" style="max-width:440px">Completa tus datos para quedar inscrito como participante. Solo te tomará '+STEPS.length+' pasos sencillos.</p><button class="btn" style="min-width:240px" onclick="start()">Comenzar registro</button></div>';return}
 if(S.done){var d=S.rd;$('app').innerHTML='<div class="center"><div style="font-size:3.5rem">✅</div><h1>¡Gracias por registrarte!</h1><p class="sub" style="max-width:480px">Tu registro fue enviado correctamente.</p><div class="card" style="max-width:480px;width:100%;text-align:left"><h2>Datos enviados</h2><p style="margin:.3em 0"><b>Nombre:</b> '+esc(d.nombres+' '+d.apellidos)+'</p><p style="margin:.3em 0"><b>Documento:</b> '+esc(d.documento)+'</p><p style="margin:.3em 0"><b>Fuerza:</b> '+esc(d.fuerza)+'</p><p style="margin:.3em 0"><b>Grado:</b> '+esc(d.grado)+'</p><p style="margin:.3em 0"><b>Celular:</b> '+esc(d.celular)+'</p><p style="margin:.3em 0"><b>Correo:</b> '+esc(d.correo)+'</p></div><div class="msg in" style="max-width:480px;text-align:left">📅 Más adelante se realizará la votación. Recuerda tus datos y tu contraseña de 4 dígitos: los necesitarás para participar.</div></div>';return}
 var n=S.rs,st=STEPS[n-1],h='<div class="center"><h1 style="font-size:clamp(1.5rem,4vw,2.2rem)">Registro de participantes</h1><div class="card" style="max-width:480px;width:100%;text-align:left"><div class="top" style="margin-bottom:8px"><span class="sub">Paso</span><b>'+n+'/'+STEPS.length+'</b></div><div class="prog"><i style="width:'+(n*100/STEPS.length)+'%"></i></div><h2 style="margin-top:18px">'+st.t+'</h2>';
 if(st.sel)h+='<label>Fuerza</label><select id="f_fuerza"><option value="">Selecciona tu fuerza…</option>'+FUERZAS.map(function(x){return '<option'+(S.rd.fuerza===x?' selected':'')+'>'+x+'</option>'}).join('')+'</select>';
 else st.f.forEach(function(f){h+='<label>'+f[1]+'</label><input type="'+(f[2]==='email'?'email':f[2]==='pin'?'password':'text')+'"'+(f[2]==='numeric'||f[2]==='pin'?' inputmode="numeric"':'')+(f[2]==='pin'?' maxlength="4" autocomplete="new-password"':'')+' id="f_'+f[0]+'" value="'+esc(S.rd[f[0]]||'')+'" autocomplete="off" onkeydown="if(event.key===\'Enter\')next()">'});
 if(st.note)h+='<div class="msg in">'+st.note+'</div>';
 if(n===STEPS.length)h+='<label class="chk"><input type="checkbox" id="f_ok"'+(S.rd.ok?' checked':'')+'><span>Autorizo el tratamiento de mis datos personales conforme a la Ley 1581 de 2012.</span></label>';
 $('app').innerHTML=h+'<div id="rm"></div><div class="row">'+(n>1?'<button class="btn sec" onclick="back()">Atrás</button>':'')+'<button class="btn" id="rb" onclick="next()">'+(n===STEPS.length?'Enviar':'Siguiente')+'</button></div></div></div>';
 var i=document.querySelector('#app input,#app select');if(i)i.focus()}
function read(){var st=STEPS[S.rs-1];
 if(st.sel)S.rd.fuerza=$('f_fuerza').value;
 else st.f.forEach(function(f){S.rd[f[0]]=$('f_'+f[0]).value.trim().replace(/\s+/g,' ')});
 if(S.rs===STEPS.length)S.rd.ok=$('f_ok').checked}
function check(){var d=S.rd,n=/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]{2,60}$/;
 switch(S.rs){
  case 1:if(!n.test(d.nombres||''))return 'Escribe tus nombres (solo letras, mínimo 2).';if(!n.test(d.apellidos||''))return 'Escribe tus apellidos (solo letras, mínimo 2).';break;
  case 2:if(!/^\d{6,10}$/.test(d.documento||''))return 'El documento debe tener entre 6 y 10 dígitos, sin puntos ni espacios.';break;
  case 3:if(FUERZAS.indexOf(d.fuerza)<0)return 'Selecciona una fuerza de la lista.';break;
  case 4:if((d.grado||'').length<2||d.grado.length>40)return 'Escribe tu grado (entre 2 y 40 caracteres).';break;
  case 5:if(!/^3\d{9}$/.test(d.celular||''))return 'El celular debe tener 10 dígitos y empezar por 3.';break;
  case 6:if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.correo||'')||d.correo.length>120)return 'Escribe un correo electrónico válido.';break;
  case 7:if(!/^\d{4}$/.test(d.clave||''))return 'La contraseña debe tener exactamente 4 dígitos.';if(d.clave!==d.clave2)return 'Las contraseñas no coinciden.';if(!d.ok)return 'Debes autorizar el tratamiento de datos para enviar el registro.';break}
 return ''}
function back(){read();S.rs--;render()}
function next(){read();var e=check();if(e){$('rm').innerHTML='<div class="msg err">'+e+'</div>';return}
 if(S.rs===STEPS.length)send();else{S.rs++;render();window.scrollTo(0,0)}}
async function send(){
 if(!sb){$('rm').innerHTML='<div class="msg err">No hay conexión con la base de datos.</div>';return}
 $('rb').disabled=true;var d=S.rd;
 try{var r=await sb.from('registrations').insert({nombres:d.nombres,apellidos:d.apellidos,documento:d.documento,fuerza:d.fuerza,grado:d.grado,celular:d.celular,correo:d.correo,acepta_datos:true,clave:d.clave});
  if(r.error)throw r.error;delete S.rd.clave;delete S.rd.clave2;S.done=true;render();window.scrollTo(0,0)}
 catch(e){$('rb').disabled=false;$('rm').innerHTML='<div class="msg err">'+(e.code==='23505'?'Este número de documento ya está registrado.':'No se pudo enviar el registro: '+esc(e.message))+'</div>'}}
if(window.supabase)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
render();
</script>
</body>
</html>
